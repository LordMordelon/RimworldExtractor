name: Build and Publish Release

on:
  workflow_dispatch:
  push:
    branches:
      - master
      # La rama de la 1.0 publica betas: misma compilacion, pero marcadas prerelease.
      - 1.0-beta

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    env:
      # Se publica el proyecto de la interfaz y no la solucion: publicar la solucion con
      # -p:TargetFramework=net10.0-windows forzaba ese framework tambien en la libreria y
      # en los tests, que no lo tienen, y cada corrida terminaba con un error NETSDK1005.
      Project: RimworldExtractorGUI/RimworldExtractorGUI.csproj
      Script_Path: tools.py
      # Que version hornea esta rama. Se declara y no se deduce: ver "Calcular la version".
      Version_Beta: 1.0.0

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        # El historial y las etiquetas completos: la version nueva sale de la ultima
        # etiqueta y de los mensajes de commit desde entonces.
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    # Reemplaza a mathieudutour/github-tag-action, que no tiene version para Node 24. La
    # regla: sube el ultimo numero; el del medio si algun commit desde la ultima etiqueta
    # empieza con "feat:"; y el primero si alguno lleva "!" antes de los dos puntos o
    # "BREAKING CHANGE" en el cuerpo. La etiqueta no se crea aca sino al publicar la
    # release, asi una compilacion fallida no deja una etiqueta sin release.
    - name: Calcular la version
      id: version
      shell: bash
      run: |
        set -euo pipefail

        # Solo etiquetas estables: una beta no tiene que cambiar de donde sale el
        # proximo numero, y "1.0.0-beta.1" ni siquiera se puede partir con IFS=. El
        # --exclude hace falta ademas del --match: el * de un glob se come el guion, asi
        # que "[0-9]*.[0-9]*.[0-9]*" tambien casa con "1.0.0-beta.1".
        ultima=$(git describe --tags --abbrev=0 --match '[0-9]*' --exclude '*-*')

        if [ "$GITHUB_REF_NAME" = "master" ]; then
          IFS=. read -r mayor menor parche <<< "$ultima"
          if git log "$ultima"..HEAD --format='%s%n%b' | grep -qE '^[a-z]+(\(.+\))?!:|^BREAKING CHANGE'; then
            mayor=$((mayor + 1))
            menor=0
            parche=0
          elif git log "$ultima"..HEAD --format=%s | grep -qE '^feat(\(.+\))?:'; then
            menor=$((menor + 1))
            parche=0
          else
            parche=$((parche + 1))
          fi
          nueva="$mayor.$menor.$parche"
        else
          # Fuera de master la version no se deduce de los mensajes de commit: la rama dice
          # cual esta horneando, en Version_Beta. Deducirla la ataba a que el commit que sube
          # el numero siguiera en el rango desde la ultima etiqueta estable, y el dia que
          # master publique una estable que ya lo incluya, la beta siguiente saldria con otra
          # version en vez de seguir la serie.
          #
          # El numero sale del maximo que ya exista y no de contar las etiquetas: contarlas
          # reutiliza un numero si alguna se borra, y entonces la release choca con una que
          # todavia esta. El cut parte por puntos, asi que "1.0.0-beta.12" da 12 en el campo 4.
          ultimo=$(git tag --list "$Version_Beta-beta.*" | cut -d. -f4 | sort -n | tail -1)
          nueva="$Version_Beta-beta.$(( ${ultimo:-0} + 1 ))"
        fi

        # La release se marca prerelease mas abajo, y GitHub deja las prereleases fuera de
        # releases/latest, que es donde mira la aplicacion.
        echo "Ultima etiqueta estable: $ultima -> version nueva: $nueva"
        echo "new_tag=$nueva" >> "$GITHUB_OUTPUT"

        # El cuerpo de la release sale de los asuntos de commit: en este repositorio van en
        # prosa y en español, asi que la lista ya es el resumen de que cambio. Va a un
        # archivo y no a GITHUB_OUTPUT porque son varias lineas y de ahi pasaria como
        # argumento de PowerShell, que se rompe con cualquier comilla en un mensaje.
        {
          echo "### [$nueva](https://github.com/$GITHUB_REPOSITORY/compare/$ultima...$nueva) ($(date -u +%F))"
          echo
          # Sin el marcador que evita que un commit dispare la CI: es de aca adentro y no le
          # dice nada a quien lee la release.
          git log "$ultima"..HEAD --no-merges --format='- %s' \
            | sed -E 's/ *\[(skip ci|ci skip)\]//g'
        } > .github/changelog.md
        cat .github/changelog.md

    - name: Escribir la version y el texto de la release
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        python $env:Script_Path version ${{ steps.version.outputs.new_tag }}
        python $env:Script_Path template .github/changelog.md

    - name: Compilar y probar
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        dotnet test RimworldExtractor.sln -c Release
      # Los tests que necesitan la instalacion de RimWorld se declaran Inconclusive, que
      # cuenta como omitido: en el runner no hay juego instalado y no fallan por eso.

    - name: Publicar
      run: |
        # Sin esto, un comando que falla no corta el paso: PowerShell sigue con el
        # siguiente y el paso sale en verde si el ultimo anduvo. Asi paso inadvertido un
        # error de dotnet publish durante varias releases.
        $PSNativeCommandUseErrorActionPreference = $true
        dotnet publish $env:Project -c Release -o publish_standard
        dotnet publish $env:Project -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeAllContentForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish_portable
        python $env:Script_Path cleanup

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ steps.version.outputs.new_tag }}
        target_commitish: ${{ github.sha }}
        draft: false
        # Una beta no se le ofrece a nadie como actualizacion: la aplicacion consulta
        # releases/latest, de donde GitHub excluye las prereleases.
        prerelease: ${{ github.ref_name != 'master' }}
        files: |
          RimworldExtractor-Standard.zip
          RimworldExtractor-Portable.exe
        body_path: .github/release_template.txt
